
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="resources/css/reset.css">
    <link rel="stylesheet" href="resources/css/style.css">
</head>
<body class="color">
    <header>
        <div class="image">
            <img src="./resources/Images/cartoon-math-background/2341797.jpg" alt="math background" />
        </div>
    </header>

    <h1>Calculate!</h1>

    <div id="calculator" class="calculator">
        <div id="screen"></div>
        
        <div id="buttons">
            <div class="number" id="num1">1</div>
            <div class="number" id="num2">2</div>
            <div class="number" id="num3">3</div>
            <div class="number" id="num4">4</div>

            <div class="number" id="num5">5</div>
            <div class="number" id="num6">6</div>
            <div class="number" id="num7">7</div>
            <div class="number" id="num8">8</div>

            <div class="number" id="num9">9</div>
            <div class="number" id="num0">0</div>
            <div class="operator" id="equals">=</div>
            <div class="clear number" id="clear">C</div>

            <div class="operator" id="add">+</div>
            <div class="operator" id="subtract">-</div>
            <div class="operator" id="multiply">*</div>
            <div class="operator" id="divide">/</div>
        </div>
    </div>
    <script src="./resources/js/script.js"></script>
</body>
</html>
